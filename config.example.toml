# copy to $XDG_CONFIG_HOME/selector/config.toml (or ~/.config/selector/config.toml).

# which layer the surfaces sit on: background, bottom, top, overlay
layer = "bottom"

# how far the pointer must travel, in pixels, before a press counts as a drag
drag_threshold = 3.0

# outline thickness in pixels, 0 disables the outline
border_width = 1

# ask the compositor to blur what is behind the selection
# needs a compositor implementing ext-background-effect, and only shows through a translucent fill
blur = false

# colours are #rrggbb or #rrggbbaa, alpha defaults to ff when omitted
fill = "#4c9ed940"
border = "#4c9ed9cc"
# colors = "colors.toml"

# whichever of fill and border the external colour sets wins over the values above
# a missing file is only a warning, since the generator may not have run yet
